plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def generatedPlannerAssets = layout.buildDirectory.dir('generated/plannerAssets')

android {
    namespace 'ci.monplanificateur'
    compileSdk 35

    defaultConfig {
        applicationId 'ci.monplanificateur'
        minSdk 26
        targetSdk 35
        versionCode 25
        versionName '1.6.9'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets {
        main.assets.srcDir(generatedPlannerAssets)
    }
}

tasks.register('syncPlannerWebAssets', Sync) {
    from(rootProject.file('../index.html'))
    into(generatedPlannerAssets)
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncPlannerWebAssets')
}

dependencies {
    // Le modèle latin est embarqué : reconnaissance disponible sans réseau et sans compte.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'org.apache.poi:poi:5.5.1'
    implementation 'org.apache.poi:poi-scratchpad:5.5.1'
}
